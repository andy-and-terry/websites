<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --border: #1e1e2e;
    --border-glow: #2a2a4a;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --accent: #5b6cf5;
    --accent-bright: #7b8cff;
    --accent-dim: #2a3080;
    --success: #3ddc84;
    --danger: #ff4d6d;
    --danger-dim: #3d0015;
    --mono: 'JetBrains Mono', monospace;
    --display: 'Syne', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--display);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(91,108,245,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,108,245,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse 60% 50% at 50% 30%, rgba(91,108,245,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* LOGIN VIEW */
  #login-view {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
  }
  .login-card {
    width: 100%; max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2.5rem;
    position: relative;
    animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
  }
  .login-card::before {
    content: '';
    position: absolute;
    top: -1px; left: -1px; right: -1px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    border-radius: 4px 4px 0 0;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono);
    font-size: 0.65rem; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent-bright);
    background: rgba(91,108,245,0.1);
    border: 1px solid rgba(91,108,245,0.2);
    padding: 4px 10px; border-radius: 2px; margin-bottom: 1.2rem;
  }
  .badge::before {
    content: '';
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-bright);
    box-shadow: 0 0 6px var(--accent-bright);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .card-header { margin-bottom: 2rem; }
  h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; margin-bottom: 0.4rem; }
  h1 span { color: var(--accent-bright); }
  .subtitle { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; }

  .field { margin-bottom: 1.2rem; }
  label {
    display: block; font-family: var(--mono);
    font-size: 0.68rem; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 0.5rem;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono); font-size: 0.9rem;
    padding: 0.75rem 1rem; border-radius: 3px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    caret-color: var(--accent-bright);
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,108,245,0.12);
  }
  input::placeholder { color: #3a3a55; }

  /* HONEYPOT */
  .hp-field {
    position: absolute; left: -9999px; top: -9999px;
    width: 1px; height: 1px; overflow: hidden; opacity: 0;
    pointer-events: none;
  }

  /* PASSWORD TOGGLE */
  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer;
    padding: 4px; font-size: 0.75rem; font-family: var(--mono);
    letter-spacing: 0.05em; transition: color 0.2s;
  }
  .pw-toggle:hover { color: var(--accent-bright); }

  /* ERROR / RATE MSG */
  #error-msg {
    display: none;
    font-family: var(--mono); font-size: 0.72rem;
    color: var(--danger); background: var(--danger-dim);
    border: 1px solid rgba(255,77,109,0.25);
    padding: 0.6rem 0.85rem; border-radius: 3px;
    margin-bottom: 1.2rem; letter-spacing: 0.04em;
  }
  #error-msg.show { display: block; animation: shake 0.3s ease; }
  @keyframes shake {
    0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}
  }
  #rate-msg {
    display: none;
    font-family: var(--mono); font-size: 0.72rem;
    color: #ffb347; background: rgba(255,179,71,0.08);
    border: 1px solid rgba(255,179,71,0.2);
    padding: 0.6rem 0.85rem; border-radius: 3px;
    margin-bottom: 1.2rem; letter-spacing: 0.04em;
  }
  #rate-msg.show { display: block; }

  /* BUTTON */
  .btn-login {
    width: 100%; background: var(--accent); color: #fff; border: none;
    font-family: var(--display); font-size: 0.9rem; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 0.85rem; border-radius: 3px; cursor: pointer;
    position: relative; overflow: hidden;
    transition: background 0.2s, transform 0.1s;
    margin-bottom: 1.5rem;
  }
  .btn-login:hover:not(:disabled) { background: var(--accent-bright); }
  .btn-login:active:not(:disabled) { transform: scale(0.98); }
  .btn-login:disabled { background: var(--accent-dim); color: var(--muted); cursor: not-allowed; }

  /* ATTEMPT DOTS */
  .attempt-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 1.2rem; }
  .attempt-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); transition: background 0.3s; }
  .attempt-dot.used { background: var(--danger); box-shadow: 0 0 5px var(--danger); }

  /* FOOTER */
  .card-footer {
    border-top: 1px solid var(--border); padding-top: 1.2rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .footer-tag { font-family: var(--mono); font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em; }
  .footer-tag span { color: var(--accent-bright); }

  /* MAIN VIEW */
  #main-content-view {
    display: none; position: relative; z-index: 1;
    min-height: 100vh; padding: 3rem 2rem;
  }
  #main-content-view.active { display: block; animation: fadeIn 0.5s ease both; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  #main-content { max-width: 800px; margin: 0 auto; }

  .session-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 2rem; padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }
  .session-header h2 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .session-header h2 span { color: var(--accent-bright); }

  .btn-logout {
    font-family: var(--mono); font-size: 0.7rem; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); background: none;
    border: 1px solid var(--border); padding: 6px 14px;
    border-radius: 3px; cursor: pointer; transition: all 0.2s;
  }
  .btn-logout:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-dim); }

  .session-info { display: grid; grid-template-columns: repeat(auto-fit,minmax(180px,1fr)); gap: 1rem; margin-bottom: 2rem; }
  .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1.2rem; }
  .info-card .label { font-family: var(--mono); font-size: 0.62rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.4rem; }
  .info-card .value { font-family: var(--mono); font-size: 0.9rem; color: var(--success); }

  .content {
    background: var(--surface); border: 1px dashed var(--border-glow);
    border-radius: 4px; padding: 3rem; text-align: center;
    color: var(--muted); font-family: var(--mono); font-size: 0.8rem; letter-spacing: 0.06em;
  }
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <div class="card-header">
      <div class="badge">Secure Auth</div>
      <h1>Sign <span>In</span></h1>
      <p class="subtitle">// authenticated access only</p>
    </div>

    <div id="error-msg" role="alert"></div>
    <div id="rate-msg" role="alert"></div>

    <div class="attempt-dots" id="attempt-dots">
      <div class="attempt-dot" id="dot-0"></div>
      <div class="attempt-dot" id="dot-1"></div>
      <div class="attempt-dot" id="dot-2"></div>
      <div class="attempt-dot" id="dot-3"></div>
      <div class="attempt-dot" id="dot-4"></div>
    </div>

    <form id="login-form" novalidate autocomplete="off">

      <!-- HONEYPOT FIELDS -->
      <div class="hp-field" aria-hidden="true">
        <label for="hp-email">Email</label>
        <input type="text" id="hp-email" name="email" tabindex="-1" autocomplete="off">
      </div>
      <div class="hp-field" aria-hidden="true">
        <label for="hp-website">Website</label>
        <input type="text" id="hp-website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="enter username"
               autocomplete="off" spellcheck="false" maxlength="64" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" name="password" placeholder="enter password"
                 autocomplete="off" maxlength="128" required>
          <button type="button" class="pw-toggle" id="pw-toggle" tabindex="-1">SHOW</button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="login-btn">Authenticate</button>
    </form>

    <div class="card-footer">
      <span class="footer-tag">PROTECTION: <span>HONEYPOT + RATE LIMIT</span></span>
      <span class="footer-tag" id="lockout-timer"></span>
    </div>
  </div>
</div>

<div id="main-content-view">
  <div id="main-content">
    <div class="session-header">
      <h2>Welcome, <span id="welcome-name"></span></h2>
      <button class="btn-logout" id="logout-btn">Logout</button>
    </div>
    <div class="session-info">
      <div class="info-card">
        <div class="label">Status</div>
        <div class="value">● Authenticated</div>
      </div>
      <div class="info-card">
        <div class="label">Session Started</div>
        <div class="value" id="session-time">—</div>
      </div>
      <div class="info-card">
        <div class="label">User Role</div>
        <div class="value" id="user-role">—</div>
      </div>
    </div>
    <div class="content">
        <p>TMB Staff page</p>
        <hr>
        <p><a href="https://docs.google.com/forms/d/e/1FAIpQLSdB1zY04chd-_ZIwXqDTH1jLHEKEFux2QLVD6e58w4GIjJcvQ/viewform?usp=publish-editor">Suggestions</a></p>
    </div>
  </div>
</div>

<script>
// ── RIGHT-CLICK PROTECTION ────────────────────────
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("keydown", e => {
  if (
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase())) ||
    (e.ctrlKey && e.key.toUpperCase() === "U")
  ) {
    e.preventDefault();
    e.stopPropagation();
  }
});

// ── CREDENTIALS ───────────────────────────────────
const USERS = {
  "admin": { password: "abc123", role: "Administrator" },
  "noahkyr@tmbstaff": { password: "abc123q", role: "TMB Staff" }
};

// ── RATE LIMIT STATE ──────────────────────────────
const MAX_ATTEMPTS = 5;
const LOCKOUT_MS = 30000;
let attempts = 0;
let lockoutUntil = 0;
let lockoutTimer = null;
const formLoadTime = Date.now();

// ── DOM REFS ──────────────────────────────────────
const loginView   = document.getElementById("login-view");
const mainView    = document.getElementById("main-content-view");
const form        = document.getElementById("login-form");
const usernameEl  = document.getElementById("username");
const passwordEl  = document.getElementById("password");
const hpEmail     = document.getElementById("hp-email");
const hpWebsite   = document.getElementById("hp-website");
const errorMsg    = document.getElementById("error-msg");
const rateMsg     = document.getElementById("rate-msg");
const loginBtn    = document.getElementById("login-btn");
const pwToggle    = document.getElementById("pw-toggle");
const lockoutEl   = document.getElementById("lockout-timer");
const welcomeName = document.getElementById("welcome-name");
const sessionTime = document.getElementById("session-time");
const userRoleEl  = document.getElementById("user-role");
const logoutBtn   = document.getElementById("logout-btn");

// ── PASSWORD TOGGLE ───────────────────────────────
pwToggle.addEventListener("click", () => {
  const hidden = passwordEl.type === "password";
  passwordEl.type = hidden ? "text" : "password";
  pwToggle.textContent = hidden ? "HIDE" : "SHOW";
});

// ── HELPERS ───────────────────────────────────────
function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.remove("show");
  void errorMsg.offsetWidth;
  errorMsg.classList.add("show");
}
function clearError() { errorMsg.classList.remove("show"); }

function updateDots() {
  for (let i = 0; i < MAX_ATTEMPTS; i++) {
    document.getElementById("dot-" + i).classList.toggle("used", i < attempts);
  }
}

function startLockout() {
  loginBtn.disabled = true;
  if (lockoutTimer) clearInterval(lockoutTimer);
  lockoutTimer = setInterval(() => {
    const remaining = Math.ceil((lockoutUntil - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(lockoutTimer);
      loginBtn.disabled = false;
      lockoutEl.textContent = "";
      rateMsg.classList.remove("show");
      attempts = 0;
      updateDots();
    } else {
      lockoutEl.textContent = "LOCKED: " + remaining + "s";
    }
  }, 250);
}

function isBotDetected() {
  if (hpEmail.value || hpWebsite.value) return true;
  if (Date.now() - formLoadTime < 800) return true;
  return false;
}

// ── SUBMIT ────────────────────────────────────────
form.addEventListener("submit", function(e) {
  e.preventDefault();

  if (Date.now() < lockoutUntil) return;

  clearError();

  // Honeypot check — silent fake delay
  if (isBotDetected()) {
    loginBtn.textContent = "Authenticating...";
    loginBtn.disabled = true;
    setTimeout(function() {
      loginBtn.textContent = "Authenticate";
      loginBtn.disabled = false;
    }, 2000);
    return;
  }

  var username = usernameEl.value.trim().toLowerCase();
  var password = passwordEl.value;

  if (!username || !password) {
    showError("Username and password are required.");
    return;
  }

  loginBtn.textContent = "Verifying...";
  loginBtn.disabled = true;

  // Small delay to mimic server round-trip
  setTimeout(function() {
    var user = USERS[username];
    var valid = user && user.password === password;

    if (valid) {
      welcomeName.textContent = usernameEl.value.trim();
      sessionTime.textContent = new Date().toLocaleTimeString();
      userRoleEl.textContent  = user.role;

      loginView.style.transition = "opacity 0.4s";
      loginView.style.opacity = "0";
      setTimeout(function() {
        loginView.style.display = "none";
        mainView.classList.add("active");
      }, 400);

    } else {
      attempts++;
      updateDots();

      if (attempts >= MAX_ATTEMPTS) {
        lockoutUntil = Date.now() + LOCKOUT_MS;
        rateMsg.textContent = "Too many failed attempts. Locked for 30 seconds.";
        rateMsg.classList.add("show");
        startLockout();
        showError("Maximum attempts reached. Please wait.");
      } else {
        showError("Invalid credentials. " + (MAX_ATTEMPTS - attempts) + " attempt(s) remaining.");
        loginBtn.textContent = "Authenticate";
        loginBtn.disabled = false;
      }
    }
  }, 400);
});

// ── LOGOUT ────────────────────────────────────────
logoutBtn.addEventListener("click", function() {
  mainView.classList.remove("active");
  loginView.style.display = "";
  loginView.style.opacity = "";
  attempts = 0;
  updateDots();
  usernameEl.value = "";
  passwordEl.value = "";
  passwordEl.type = "password";
  pwToggle.textContent = "SHOW";
  loginBtn.textContent = "Authenticate";
  loginBtn.disabled = false;
  clearError();
  rateMsg.classList.remove("show");
});
</script>
</body>
</html>
