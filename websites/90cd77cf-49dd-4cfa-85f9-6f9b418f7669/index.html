<!DOCTYPE HTML>
<head>
  <meta charset="UTF-8">
  <title>Nothing</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <h1>Welcome</h1>
  <p>To the page called <span id="random"></span></p>
  <button onclick="fire()">Click me</button>
  <script>
    function fire() {
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      document.querySelector('h1').textContent = 'Happy Teachers\' Day!';
    }

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
    setInterval(() => {
      const el = document.getElementById('random');
      let text = '';
      for (let i = 0; i < 8; i++) {
        text += chars[Math.floor(Math.random() * chars.length)];
      }
      el.textContent = text;
    }, 50);
  </script>
</body>
