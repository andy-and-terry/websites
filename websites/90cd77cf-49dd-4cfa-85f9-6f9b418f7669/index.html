<!DOCTYPE HTML>
<head>
  <meta charset="UTF-8">
  <title>Nothing</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Nabla&display=swap');
    body{
      font-family: sans-serif
    }
    .h1{
      font-family: Nabla, sans-serif
    }
</style>
</head>
<body>
  <h1>Welcome</h1>
  <p id="sub">To the page called <span id="random"></span></p>
  <button onclick="fire()">Click me</button>
  <p><a href="https://drive.google.com/file/d/1BNNcOhIwoMs6DqUQ6l-NgRB4fW41A2rp/view?usp=sharing">Video I made</a></p>
  <p><a href="https://raw.githubusercontent.com/andy-and-terry/websites/refs/heads/website-5b6457e5-c5fe-40de-92f7-882cd1f342d6/websites/90cd77cf-49dd-4cfa-85f9-6f9b418f7669/index.html">See the code</a></p>
  <hr>
  <script>
    function fire() {
      document.getElementById('sub').style.display = 'none';
      document.querySelector('h1').textContent = "Happy Teachers\' Day!";
      setInterval(() => {
        confetti({
          particleCount: 10,
          startVelocity: 0.5,
          ticks: 500,
          gravity: 0.4,
          spread: 100,
          origin: { x: Math.random(), y: -0.1 }
        });
      }, 100);
    }

    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*⟁∮◊❦϶⍋⌬✂⚛⟡♆₪✺☄⌘✧⟠⚕✱⟢⌇☖✥⚘⟣❃☯⚜⍟✤⟐☂⚝✦⌥⟒☍✩⚚⟑❂☾✪⟓☄⚞✫⟔☇✬⚡⟕☈✭⚟⟖☉✮⚠⟗☊✯⚡⟘☋✰⚢⟙☌✱⚣⟚☍✲⚤⟛☎✳⚥⟜☏✴⚦⟝☐✵⚧⟞☑✶⚨⟟☒✷⚩⟠☓✸⚪⟡◐✹⚫⟢◑✺⚬⟣◒✻⚭⟤◓✼⚮⟥◔✽⚯⟦◕✾⚰⟧◖✿⚱⟨◗❀⚲⟩◘❁⚳⟪◙❂⚴⟫◚❃⚵⟬◛❄⚶⟭◜❅⚷⟮◝❆⚸⟯◞❇⚹⟰◟❈⚺⟱◠❉⚻⟲◡❊⚼⟳◢❋⚽⟴◣❍⚾⟵◤❎⚿⟶◥❏⛀⟷◦❐⛁⟸◧❑⛂⟹◨❒⛃⟺◩❓⛄⟻◪❔⛅⟼◫❕⛆⟽◬❖⛇⟾◭❗⛈⟿◮❘⛉⤀◯❙⛊⤁';
    setInterval(() => {
      const el = document.getElementById('random');
      let text = '';
      for (let i = 0; i < 8; i++) {
        text += chars[Math.floor(Math.random() * chars.length)];
      }
      el.textContent = text;
    }, 50);
  </script>
</body>
