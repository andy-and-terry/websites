<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoStream – Browse</title>
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>

<nav class="navbar">
  <a class="brand" href="index.html">VideoStream</a>
  <div class="nav-right">
    <a class="btn btn-secondary" href="../logout.html">Logout</a>
  </div>
</nav>

<main class="page-content">
  <div class="container">
    <h1 class="browse-title">Browse Movies</h1>
    <p id="loading-msg">Loading movies…</p>
    <div class="movies-grid" id="movies-grid" hidden></div>
  </div>
</main>

<script>
  // Auth gate – redirect to site root if not logged in
  if (!localStorage.getItem("sessionUser")) {
    location.href = "../index.html";
  }

  async function loadMovies() {
    const grid = document.getElementById("movies-grid");
    const loadingMsg = document.getElementById("loading-msg");

    try {
      const res = await fetch("../assets/movies.json");
      if (!res.ok) throw new Error("Failed to load movies");
      const movies = await res.json();

      loadingMsg.remove();
      grid.removeAttribute("hidden");

      movies.forEach(function(movie) {
        const card = document.createElement("a");
        card.className = "movie-card";
        card.href = "watch/index.html?watchid=" + movie.id;

        const img = document.createElement("img");
        img.src = movie.image;
        img.alt = movie.name;
        img.loading = "lazy";

        const title = document.createElement("div");
        title.className = "movie-title";
        title.textContent = movie.name;

        card.appendChild(img);
        card.appendChild(title);
        grid.appendChild(card);
      });
    } catch (e) {
      loadingMsg.textContent = "Could not load movies. Please try again later.";
      console.error(e);
    }
  }

  loadMovies();
</script>

</body>
</html>
