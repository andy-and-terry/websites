<!DOCTYPE html>
<html>
<head>
<title>Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;background:#111;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">

<div id="choice">
  <h2>Choose</h2>
  <button onclick="showStream()">Streaming</button>
  <button onclick="showWatch()">Watching</button>
</div>

<div id="streamForm" style="display:none;">
  <h3>Broadcast Info</h3>
  <input id="playerID" placeholder="Player ID (this is your Stream ID)"><br><br>
  <input id="streamPass" type="password" placeholder="Password"><br><br>
  <button onclick="startStream()">Get Upload Command</button>
  <pre id="streamOut"></pre>
</div>

<div id="watchForm" style="display:none;">
  <h3>Watch</h3>
  <input id="streamID" placeholder="Stream ID"><br><br>
  <input id="watchPass" type="password" placeholder="Password (if required)"><br><br>
  <button onclick="startWatch()">Watch</button>
  <p id="watchError" style="color:red;"></p>
</div>

<video id="v" controls autoplay muted playsinline webkit-playsinline style="display:none;width:100vw;height:100vh;position:fixed;top:0;left:0;"></video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
  alert("https://drive.google.com/file/d/1U2LNABNd7CXrnkCCq1oa3NESoCtDI5qq/view?usp=sharing")
  var BASE = "https://andyandterry--ab264a0c8e0611f1a61f1607ee4eb77e.web.val.run";

  var currentStreamID = null;
  var viewerId = Math.random().toString(36).slice(2);
  var heartbeatTimer = null;
  var fetchIntervalMs = 2000; // default until we know viewer count

  function computeFetchInterval(viewerCount) {
    var perViewerFetchesPerMin = Math.max(1, Math.floor(1000 / viewerCount));
    return Math.round(60000 / perViewerFetchesPerMin);
  }

  function startHeartbeat(streamID) {
    currentStreamID = streamID;
    async function tick() {
      try {
        await fetch(BASE + '/heartbeat?streamID=' + encodeURIComponent(streamID) + '&viewerId=' + viewerId, { method: 'POST' });
        var res = await fetch(BASE + '/viewercount?streamID=' + encodeURIComponent(streamID));
        var json = await res.json();
        fetchIntervalMs = computeFetchInterval(json.count || 1);
      } catch (e) {}
    }
    tick();
    heartbeatTimer = setInterval(tick, 5000);
  }

  function showStream() {
    document.getElementById('choice').style.display = 'none';
    document.getElementById('streamForm').style.display = 'block';
  }
  function showWatch() {
    document.getElementById('choice').style.display = 'none';
    document.getElementById('watchForm').style.display = 'block';
  }

  function startStream() {
    var playerID = document.getElementById('playerID').value;
    var pass = document.getElementById('streamPass').value;
    if (!playerID || !pass) { alert('Fill both fields'); return; }
    var cmd = 'curl -X POST ' + BASE + '/?filename=FILENAME&playerID=' + encodeURIComponent(playerID) + '&password=' + encodeURIComponent(pass) + ' --data-binary @FILENAME';
    document.getElementById('streamOut').textContent = 'Your Stream ID is: ' + playerID + '\nUse this in your push script: ' + cmd;
  }

  function startWatch() {
    var streamID = document.getElementById('streamID').value;
    var pass = document.getElementById('watchPass').value;
    if (!streamID) {
      document.getElementById('watchError').textContent = 'Enter a Stream ID';
      return;
    }
    var filename = streamID + '_playlist.m3u8';
    var testUrl = BASE + '/' + filename + (pass ? '?password=' + encodeURIComponent(pass) : '');

    fetch(testUrl, { method: 'GET' }).then(function(res) {
      if (res.status === 403) {
        document.getElementById('watchError').textContent = 'Wrong password';
        return;
      }
      if (res.status === 404) {
        document.getElementById('watchError').textContent = 'Stream not live yet';
        return;
      }
      document.getElementById('watchForm').style.display = 'none';
      var video = document.getElementById('v');
      video.style.display = 'block';

      startHeartbeat(streamID);

      if (Hls.isSupported()) {
        var hls = new Hls({
          manifestLoadingTimeOut: 20000,
          levelLoadingTimeOut: 20000,
        });
        // dynamically throttle playlist polling to match computed fetchIntervalMs
        var originalLoad = hls.loadSource.bind(hls);
        hls.loadSource(testUrl);
        hls.attachMedia(video);

        // hls.js polls internally; approximate throttling by overriding config live
        setInterval(function() {
          try {
            hls.config.liveSyncDurationCount = 3;
          } catch (e) {}
        }, fetchIntervalMs);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = testUrl;
      }
    });
  }
</script>

</body>
</html>
