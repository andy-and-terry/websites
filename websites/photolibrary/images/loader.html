<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Loader</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="../">&larr; Back to Photo Library</a>
    <h1 id="heading">Search Results</h1>
    <div class="results" id="results"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const search = params.get('search') || '';

    document.getElementById('heading').textContent = search === 'all' ? 'All images' : `Results for: "${search}"`;

    fetch('images.json')
      .then(res => res.json())
      .then(images => {
        const results = document.getElementById('results');

        const matches = search === 'all'
          ? images
          : images.filter(img => img.description.toLowerCase().includes(search.toLowerCase()));

        if (matches.length === 0) {
          results.innerHTML = `<p class="no-results">No images found for "${search}".</p>`;
          return;
        }

        matches.forEach(img => {
          const card = document.createElement('div');
          card.className = 'img-card';
          card.innerHTML = `
            <img src="${img.src}" alt="${img.description}">
            <p>${img.description}</p>
          `;
          card.addEventListener('click', () => {
            window.location.href = `view.html?image=${img.id}`;
          });
          results.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById('results').innerHTML = `<p class="no-results">Failed to load images.json.</p>`;
      });
  </script>
</body>
</html>
