<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Viewer</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="loader.html">&larr; Back to results</a>
    <h1 id="heading">Image</h1>
    <div id="view"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const imageId = params.get('image') || '';

    fetch('images.json')
      .then(res => res.json())
      .then(images => {
        const view = document.getElementById('view');
        const image = images.find(img => img.id === imageId);

        if (!image) {
          view.innerHTML = `<p class="no-results">Image not found.</p>`;
          return;
        }

        document.getElementById('heading').textContent = image.description;
        view.innerHTML = `
          <img src="${image.src}" alt="${image.description}">
          <p>${image.description}</p>
        `;
      })
      .catch(() => {
        document.getElementById('view').innerHTML = `<p class="no-results">Failed to load images.json.</p>`;
      });
  </script>
</body>
</html>
