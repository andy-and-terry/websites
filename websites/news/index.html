<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Latest news and announcements from Websites - Hosting and Maintaining.">
  <title>Latest News - Websites</title>
  <link rel="icon" type="image/x-icon" href="../../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
      color: #222;
    }

    a {
      color: #0c447c;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      font-size: 14px;
    }

    #banners {
      margin-bottom: 1.25rem;
    }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fef0e6;
      border: 1px solid #f3d9c0;
      color: #7a3510;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .banner-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .banner-text strong {
      font-size: 14px;
    }

    .banner-text span {
      font-size: 13px;
      opacity: 0.85;
    }

    .banner-close {
      flex-shrink: 0;
      background: none;
      border: none;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: inherit;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .banner-close:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .post-list {
      display: grid;
      gap: 0.75rem;
    }

    .post-card {
      position: relative;
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      cursor: pointer;
    }

    .post-card:hover {
      border-color: rgba(0, 0, 0, 0.2);
    }

    .post-title {
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 4px;
    }

    .post-meta {
      font-size: 13px;
      color: #888;
      margin: 0 0 6px;
    }

    .post-summary,
    .post-content {
      font-size: 14px;
      color: #666;
      margin: 0;
      line-height: 1.6;
    }

    .post-content {
      display: none;
      margin-top: 8px;
    }

    .post-card.open .post-content {
      display: block;
    }

    .post-actions {
      display: flex;
      gap: 6px;
      position: absolute;
      top: 10px;
      right: 10px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
    }

    .post-card:hover .post-actions,
    .post-card:focus-within .post-actions {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .post-card.open .post-actions {
      position: static;
      opacity: 1;
      transform: none;
      pointer-events: auto;
      justify-content: flex-start;
      margin-bottom: 10px;
    }

    .action-btn {
      font: inherit;
      font-size: 12px;
      padding: 4px 9px;
      border: none;
      border-radius: 999px;
      background: #f1f0e8;
      color: #444441;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .action-btn:hover {
      background: #e2e0d0;
    }

    .action-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .btn-primary {
      background: #0c447c;
      color: white;
    }

    .btn-primary:hover {
      background: #0a3760;
    }

    .comment-form {
      display: none;
      flex-direction: column;
      gap: 6px;
      margin: 0 0 10px;
      padding: 10px;
      background: #f8f7f2;
      border-radius: 8px;
    }

    .post-card.open .comment-form.open {
      display: flex;
    }

    .comment-form textarea,
    .comment-form input,
    .modal textarea,
    .modal input[type="text"],
    .modal input[type="email"] {
      font: inherit;
      font-size: 13px;
      padding: 6px 8px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      resize: vertical;
    }

    .comment-form-actions,
    .modal-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .status-msg {
      font-size: 12px;
      color: #666;
      margin: 0;
      min-height: 1em;
    }

    .status-msg.error {
      color: #a02020;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 12px;
      padding: 20px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal h2 {
      margin: 0;
      font-size: 16px;
    }

    .modal label {
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .modal .checkbox-row {
      flex-direction: row;
      align-items: center;
      gap: 6px;
    }

    .modal .checkbox-row input {
      width: auto;
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      vertical-align: middle;
    }

    .badge-red {
      background: #fcebeb;
      color: #791f1f;
    }
  </style>
</head>
<body>
  <a class="back-link" href="../../index.html">&larr; Back to Websites</a>
  <h1>Latest News</h1>
  <hr>
  <div id="banners"></div>
  <div class="post-list" id="post-list">
    <p>Loading news&hellip;</p>
  </div>

  <div class="modal-overlay" id="add-post-modal">
    <form class="modal" id="add-post-form" novalidate>
      <h2>Suggest a new post</h2>
      <label>Your email
        <input type="email" name="fromEmail" required>
      </label>
      <label>Title
        <input type="text" name="title" required>
      </label>
      <label>Summary
        <input type="text" name="summary">
      </label>
      <label>Content
        <textarea name="content" rows="4"></textarea>
      </label>
      <label class="checkbox-row">
        <input type="checkbox" name="important">
        Mark as important
      </label>
      <p class="status-msg" id="add-post-status"></p>
      <div class="modal-actions">
        <button type="button" class="action-btn" id="add-post-cancel">Cancel</button>
        <button type="submit" class="action-btn btn-primary">Submit</button>
      </div>
    </form>
  </div>

<script>
  (() => {
    "use strict";

    const DATA_DIR = "assets/data/";
    const DISMISSED_KEY = "latestNewsDismissedBanners";

    // Deploy valtown/newsApi.ts as an HTTP val on val.town, then paste
    // its live URL here (Val Town -> your val -> Copy URL).
    const NEWS_API_URL = "https://REPLACE-WITH-YOUR-VAL-URL.web.val.run";

    const postList = document.getElementById("post-list");
    const bannerContainer = document.getElementById("banners");
    const addPostModal = document.getElementById("add-post-modal");
    const addPostForm = document.getElementById("add-post-form");
    const addPostStatus = document.getElementById("add-post-status");


    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }


    function getDismissed() {
      try {
        const value = localStorage.getItem(DISMISSED_KEY);
        const parsed = JSON.parse(value || "[]");

        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        console.warn("Unable to read dismissed banners.", err);
        return [];
      }
    }


    function dismissBanner(id) {
      try {
        const dismissed = getDismissed();

        if (!dismissed.includes(id)) {
          dismissed.push(id);

          localStorage.setItem(
            DISMISSED_KEY,
            JSON.stringify(dismissed)
          );
        }
      } catch (err) {
        console.warn("Unable to save dismissed banner.", err);
      }
    }


    async function fetchJson(url) {
      const response = await fetch(url, {
        cache: "no-cache"
      });

      if (!response.ok) {
        throw new Error(
          `${url} returned HTTP ${response.status}`
        );
      }

      try {
        return await response.json();
      } catch (err) {
        throw new Error(
          `${url} contains invalid JSON`
        );
      }
    }


    function isValidPost(post) {
      return (
        post &&
        typeof post === "object" &&
        typeof post.id === "number" &&
        typeof post.title === "string" &&
        typeof post.author === "string" &&
        typeof post.date === "string"
      );
    }
    async function loadPosts() {
      const main = await fetchJson(
        DATA_DIR + "main.json"
      );

      if (!Array.isArray(main.posts)) {
        throw new Error(
          "main.json must contain a posts array."
        );
      }

      const results = await Promise.allSettled(
        main.posts.map(async (filename) => {
          try {
            const post = await fetchJson(
              DATA_DIR + filename
            );

            if (!isValidPost(post)) {
              throw new Error(
                "Invalid post structure."
              );
            }

            return post;
          } catch (err) {
            console.warn(
              `Skipping "${filename}"`,
              err
            );

            return null;
          }
        })
      );

      return results
        .filter((result) => {
          return result.status === "fulfilled";
        })
        .map((result) => {
          return result.value;
        })
        .filter(Boolean)
        .sort((a, b) => {
          const dateA = Date.parse(a.date);
          const dateB = Date.parse(b.date);

          return (
            (Number.isNaN(dateB) ? 0 : dateB) -
            (Number.isNaN(dateA) ? 0 : dateA)
          );
        });
    }


    async function postToApi(action, payload) {
      try {
        const res = await fetch(NEWS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action, ...payload })
        });

        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          return {
            ok: false,
            error: data.error || `Request failed (${res.status})`
          };
        }

        return { ok: true };
      } catch (err) {
        return { ok: false, error: "Network error" };
      }
    }


    function actionBar(post) {
      return `
        <div class="post-actions"
             role="group"
             aria-label="Post actions">

          <button type="button"
                  class="action-btn report-btn"
                  data-id="${post.id}"
                  title="Report this post">
            Report
          </button>

          <button type="button"
                  class="action-btn comment-btn"
                  data-id="${post.id}"
                  title="Comment on this post">
            Comment
          </button>

          <button type="button"
                  class="action-btn add-post-btn"
                  title="Suggest a new post">
            Add post
          </button>

        </div>

        <div class="comment-form" id="comment-form-${post.id}">
          <textarea rows="3" placeholder="Your comment"></textarea>
          <input type="email" placeholder="Your email (optional)">
          <p class="status-msg"></p>
          <div class="comment-form-actions">
            <button type="button" class="action-btn comment-cancel">Cancel</button>
            <button type="button" class="action-btn btn-primary comment-send">Send</button>
          </div>
        </div>
      `;
    }


    function openPost(card) {
      document
        .querySelectorAll(".post-card.open")
        .forEach((item) => {
          if (item !== card) {
            item.classList.remove("open");
          }
        });

      card.classList.toggle("open");
    }
    function renderPosts(posts) {
      const postsById = new Map(
        posts.map((post) => {
          return [post.id, post];
        })
      );

      postList.innerHTML = posts.map((post) => {
        return `
          <article class="post-card"
                   data-id="${post.id}"
                   tabindex="0">

            ${actionBar(post)}

            <h3 class="post-title">
              ${escapeHtml(post.title)}
              ${
                post.important
                  ? '<span class="badge badge-red">Important</span>'
                  : ""
              }
            </h3>

            <p class="post-meta">
              ${escapeHtml(post.date)}
              &middot;
              ${escapeHtml(post.author)}
            </p>

            <p class="post-summary">
              ${escapeHtml(post.summary || "")}
            </p>

            <p class="post-content">
              ${escapeHtml(post.content || "")}
            </p>

          </article>
        `;
      }).join("");


      document
        .querySelectorAll(".post-card")
        .forEach((card) => {

          card.addEventListener(
            "click",
            () => {
              openPost(card);
            }
          );


          card.addEventListener(
            "keypress",
            (event) => {
              if (event.key === "Enter") {
                openPost(card);
              }
            }
          );

        });


      document
        .querySelectorAll(".report-btn")
        .forEach((button) => {

          button.addEventListener(
            "click",
            (event) => {
              event.stopPropagation();

              const post = postsById.get(
                Number(button.dataset.id)
              );

              if (!post || button.disabled) {
                return;
              }

              if (!window.confirm(`Report "${post.title}"?`)) {
                return;
              }

              button.disabled = true;
              button.textContent = "Reporting…";

              postToApi("report", {
                postId: post.id,
                postTitle: post.title,
                authorName: post.author,
                authorEmail: post.authorEmail
              }).then((result) => {
                if (result.ok) {
                  button.textContent = "Reported";
                } else {
                  button.disabled = false;
                  button.textContent = "Report";
                  window.alert(`Could not report this post: ${result.error}`);
                }
              });
            }
          );

        });


      document
        .querySelectorAll(".add-post-btn")
        .forEach((button) => {

          button.addEventListener(
            "click",
            (event) => {
              event.stopPropagation();
              openAddPostModal();
            }
          );

        });


      document
        .querySelectorAll(".comment-btn")
        .forEach((button) => {

          button.addEventListener(
            "click",
            (event) => {
              event.stopPropagation();

              const id = Number(button.dataset.id);
              const card = button.closest(".post-card");

              if (!card.classList.contains("open")) {
                openPost(card);
              }

              document
                .querySelectorAll(".comment-form.open")
                .forEach((form) => {
                  if (form.id !== `comment-form-${id}`) {
                    form.classList.remove("open");
                  }
                });

              const form = document.getElementById(`comment-form-${id}`);
              form.classList.toggle("open");

              if (form.classList.contains("open")) {
                form.querySelector("textarea").focus();
              }
            }
          );

        });


      document
        .querySelectorAll(".comment-form")
        .forEach((form) => {
          const id = Number(form.id.replace("comment-form-", ""));

          form.addEventListener("click", (event) => {
            event.stopPropagation();
          });

          form.addEventListener("keypress", (event) => {
            event.stopPropagation();
          });

          form.querySelector(".comment-cancel").addEventListener(
            "click",
            () => {
              form.classList.remove("open");
              form.querySelector("textarea").value = "";
              form.querySelector("input").value = "";

              const status = form.querySelector(".status-msg");
              status.textContent = "";
              status.classList.remove("error");
            }
          );

          form.querySelector(".comment-send").addEventListener(
            "click",
            () => {
              const post = postsById.get(id);
              const textarea = form.querySelector("textarea");
              const emailInput = form.querySelector("input");
              const status = form.querySelector(".status-msg");
              const message = textarea.value.trim();

              if (!message) {
                status.classList.add("error");
                status.textContent = "Write a comment first.";
                return;
              }

              const sendBtn = form.querySelector(".comment-send");
              sendBtn.disabled = true;
              status.classList.remove("error");
              status.textContent = "Sending…";

              postToApi("comment", {
                postId: post.id,
                postTitle: post.title,
                message,
                fromEmail: emailInput.value.trim()
              }).then((result) => {
                sendBtn.disabled = false;

                if (result.ok) {
                  textarea.value = "";
                  emailInput.value = "";
                  status.classList.remove("error");
                  status.textContent = "Sent — thanks!";

                  setTimeout(() => {
                    form.classList.remove("open");
                    status.textContent = "";
                  }, 1500);
                } else {
                  status.classList.add("error");
                  status.textContent = result.error;
                }
              });
            }
          );
        });


      document
        .querySelectorAll(".action-btn")
        .forEach((button) => {

          button.addEventListener(
            "click",
            (event) => {
              event.stopPropagation();
            }
          );

        });
    }


    function openAddPostModal() {
      addPostForm.reset();
      addPostStatus.textContent = "";
      addPostStatus.classList.remove("error");
      addPostModal.classList.add("open");
    }


    function closeAddPostModal() {
      addPostModal.classList.remove("open");
    }


    function initAddPostModal() {
      document
        .getElementById("add-post-cancel")
        .addEventListener("click", closeAddPostModal);

      addPostModal.addEventListener("click", (event) => {
        if (event.target === addPostModal) {
          closeAddPostModal();
        }
      });

      addPostForm.addEventListener("submit", (event) => {
        event.preventDefault();

        const data = new FormData(addPostForm);
        const title = String(data.get("title") || "").trim();
        const fromEmail = String(data.get("fromEmail") || "").trim();

        if (!title || !fromEmail) {
          addPostStatus.classList.add("error");
          addPostStatus.textContent = "Email and title are required.";
          return;
        }

        const submitBtn = addPostForm.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        addPostStatus.classList.remove("error");
        addPostStatus.textContent = "Sending…";

        postToApi("addPost", {
          title,
          summary: String(data.get("summary") || "").trim(),
          content: String(data.get("content") || "").trim(),
          important: data.get("important") === "on",
          fromEmail
        }).then((result) => {
          submitBtn.disabled = false;

          if (result.ok) {
            addPostStatus.classList.remove("error");
            addPostStatus.textContent = "Sent — thanks!";
            setTimeout(closeAddPostModal, 1200);
          } else {
            addPostStatus.classList.add("error");
            addPostStatus.textContent = result.error;
          }
        });
      });
    }


    function renderBanners(posts) {
      const dismissed = getDismissed();

      const importantPosts = posts.filter((post) => {
        return (
          post.important &&
          !dismissed.includes(post.id)
        );
      });


      bannerContainer.innerHTML =
        importantPosts.map((post) => {

          return `
            <div class="banner"
                 data-id="${post.id}">

              <div class="banner-text">

                <strong>
                  ${escapeHtml(post.title)}
                </strong>

                <span>
                  ${escapeHtml(post.summary || "")}
                </span>

              </div>


              <button class="banner-close"
                      aria-label="Dismiss">
                &times;
              </button>

            </div>
          `;

        }).join("");


      bannerContainer
        .querySelectorAll(".banner")
        .forEach((banner) => {

          banner.addEventListener(
            "click",
            () => {

              const card =
                document.querySelector(
                  `.post-card[data-id="${banner.dataset.id}"]`
                );


              if (!card) {
                return;
              }


              card.scrollIntoView({
                behavior: "smooth",
                block: "center"
              });


              if (!card.classList.contains("open")) {
                openPost(card);
              }

            }
          );


          banner
            .querySelector(".banner-close")
            .addEventListener(
              "click",
              (event) => {

                event.stopPropagation();

                dismissBanner(
                  Number(banner.dataset.id)
                );

                banner.remove();

              }
            );

        });
    }


    async function init() {
      try {
        const posts = await loadPosts();


        if (posts.length === 0) {
          postList.innerHTML =
            "<p>No news posts are available.</p>";

          return;
        }


        renderBanners(posts);
        renderPosts(posts);

      } catch (err) {
        console.error(
          "News loading failed:",
          err
        );

        postList.innerHTML = `
          <p>
            Unable to load the news feed.
            Please try again later.
          </p>
        `;
      }
    }


    initAddPostModal();
    init();

  })();
</script>
</body>
</html>
