<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Latest news and announcements from Websites - Hosting and Maintaining.">
  <title>Latest News - Websites</title>
  <link rel="icon" type="image/x-icon" href="../../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
      color: #222;
    }

    a {
      color: #0c447c;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      font-size: 14px;
    }

    #banners {
      margin-bottom: 1.25rem;
    }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fef0e6;
      border: 1px solid #f3d9c0;
      color: #7a3510;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .banner-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .banner-text strong {
      font-size: 14px;
    }

    .banner-text span {
      font-size: 13px;
      opacity: 0.85;
    }

    .banner-close {
      flex-shrink: 0;
      background: none;
      border: none;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: inherit;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .banner-close:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .post-list {
      display: grid;
      gap: 0.75rem;
    }

    .post-card {
      position: relative;
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      cursor: pointer;
    }

    .post-card:hover {
      border-color: rgba(0, 0, 0, 0.2);
    }

    .post-title {
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 4px;
    }

    .post-meta {
      font-size: 13px;
      color: #888;
      margin: 0 0 6px;
    }

    .post-summary,
    .post-content {
      font-size: 14px;
      color: #666;
      margin: 0;
      line-height: 1.6;
    }

    .post-content {
      display: none;
      margin-top: 8px;
    }

    .post-card.open .post-content {
      display: block;
    }

    .post-actions {
      display: flex;
      gap: 6px;
      position: absolute;
      top: 10px;
      right: 10px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
    }

    .post-card:hover .post-actions,
    .post-card:focus-within .post-actions {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .post-card.open .post-actions {
      position: static;
      opacity: 1;
      transform: none;
      pointer-events: auto;
      justify-content: flex-start;
      margin-bottom: 10px;
    }

    .action-btn {
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #f1f0e8;
      color: #444441;
      text-decoration: none;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: #e2e0d0;
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      vertical-align: middle;
    }

    .badge-red {
      background: #fcebeb;
      color: #791f1f;
    }
  </style>
</head>
<body>
  <a class="back-link" href="../../index.html">&larr; Back to Websites</a>
  <h1>Latest News</h1>
  <hr>
  <div id="banners"></div>
  <div class="post-list" id="post-list">
    <p>Loading news&hellip;</p>
  </div>

<script>
  (() => {
    "use strict";

    const DATA_DIR = "assets/data/";
    const DISMISSED_KEY = "latestNewsDismissedBanners";

    const REPORT_FORM_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSd6UTp346XZBlIvx9nAIziC-OitpheKhtS5zcSr74SYxmEC4g/viewform?usp=publish-editor";

    const ADD_POST_FORM_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSfDtFivE7wSPK8FkISpylP81XrhLT_94LX0UBf0psgjogZ5Bg/viewform?usp=publish-editor";

    const CONTACT_EMAIL = "yucheng.lee29@gmail.com";

    const WEB3FORMS_ACCESS_KEY = "";

    const postList = document.getElementById("post-list");
    const bannerContainer = document.getElementById("banners");


    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value ?? "";
      return div.innerHTML;
    }


    function getDismissed() {
      try {
        const value = localStorage.getItem(DISMISSED_KEY);
        const parsed = JSON.parse(value || "[]");

        return Array.isArray(parsed) ? parsed : [];
      } catch (err) {
        console.warn("Unable to read dismissed banners.", err);
        return [];
      }
    }


    function dismissBanner(id) {
      try {
        const dismissed = getDismissed();

        if (!dismissed.includes(id)) {
          dismissed.push(id);

          localStorage.setItem(
            DISMISSED_KEY,
            JSON.stringify(dismissed)
          );
        }
      } catch (err) {
        console.warn("Unable to save dismissed banner.", err);
      }
    }


    async function fetchJson(url) {
      const response = await fetch(url, {
        cache: "no-cache"
      });

      if (!response.ok) {
        throw new Error(
          `${url} returned HTTP ${response.status}`
        );
      }

      try {
        return await response.json();
      } catch (err) {
        throw new Error(
          `${url} contains invalid JSON`
        );
      }
    }


    function isValidPost(post) {
      return (
        post &&
        typeof post === "object" &&
        typeof post.id === "number" &&
        typeof post.title === "string" &&
        typeof post.author === "string" &&
        typeof post.date === "string"
      );
    }
    async function loadPosts() {
      const main = await fetchJson(
        DATA_DIR + "main.json"
      );

      if (!Array.isArray(main.posts)) {
        throw new Error(
          "main.json must contain a posts array."
        );
      }

      const results = await Promise.allSettled(
        main.posts.map(async (filename) => {
          try {
            const post = await fetchJson(
              DATA_DIR + filename
            );

            if (!isValidPost(post)) {
              throw new Error(
                "Invalid post structure."
              );
            }

            return post;
          } catch (err) {
            console.warn(
              `Skipping "${filename}"`,
              err
            );

            return null;
          }
        })
      );

      return results
        .filter((result) => {
          return result.status === "fulfilled";
        })
        .map((result) => {
          return result.value;
        })
        .filter(Boolean)
        .sort((a, b) => {
          const dateA = Date.parse(a.date);
          const dateB = Date.parse(b.date);

          return (
            (Number.isNaN(dateB) ? 0 : dateB) -
            (Number.isNaN(dateA) ? 0 : dateA)
          );
        });
    }


    function commentMailto(post) {
      const subject = encodeURIComponent(
        "Comment on: " + post.title
      );

      const body = encodeURIComponent(
        "Regarding " +
        post.author +
        "'s post \"" +
        post.title +
        "\":\n\n"
      );

      return (
        "mailto:" +
        CONTACT_EMAIL +
        "?subject=" +
        subject +
        "&body=" +
        body
      );
    }


    async function notifyAuthorOfReport(post) {
      if (
        !WEB3FORMS_ACCESS_KEY ||
        !post ||
        !post.authorEmail
      ) {
        return;
      }

      try {
        await fetch(
          "https://api.web3forms.com/submit",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json"
            },
            body: JSON.stringify({
              access_key: WEB3FORMS_ACCESS_KEY,
              subject:
                "Your post was flagged: " +
                post.title,
              email: post.authorEmail,
              message:
                "Your post \"" +
                post.title +
                "\" was reported by a reader."
            })
          }
        );
      } catch (err) {
        console.warn(
          "Unable to notify author.",
          err
        );
      }
    }


    function actionBar(post) {
      return `
        <div class="post-actions"
             role="group"
             aria-label="Post actions">

          <a class="action-btn report-btn"
             data-id="${post.id}"
             href="${REPORT_FORM_URL}"
             target="_blank"
             rel="noopener"
             title="Report this post">
            Report
          </a>

          <a class="action-btn"
             href="${commentMailto(post)}"
             title="Email the author">
            Comment
          </a>

          <a class="action-btn"
             href="${ADD_POST_FORM_URL}"
             target="_blank"
             rel="noopener"
             title="Suggest a new post">
            Add post
          </a>

        </div>
      `;
    }


    function openPost(card) {
      document
        .querySelectorAll(".post-card.open")
        .forEach((item) => {
          if (item !== card) {
            item.classList.remove("open");
          }
        });

      card.classList.toggle("open");
    }
    function renderPosts(posts) {
      const postsById = new Map(
        posts.map((post) => {
          return [post.id, post];
        })
      );

      postList.innerHTML = posts.map((post) => {
        return `
          <article class="post-card"
                   data-id="${post.id}"
                   tabindex="0">

            ${actionBar(post)}

            <h3 class="post-title">
              ${escapeHtml(post.title)}
              ${
                post.important
                  ? '<span class="badge badge-red">Important</span>'
                  : ""
              }
            </h3>

            <p class="post-meta">
              ${escapeHtml(post.date)}
              &middot;
              ${escapeHtml(post.author)}
            </p>

            <p class="post-summary">
              ${escapeHtml(post.summary || "")}
            </p>

            <p class="post-content">
              ${post.content || ""}
            </p>

          </article>
        `;
      }).join("");


      document
        .querySelectorAll(".post-card")
        .forEach((card) => {

          card.addEventListener(
            "click",
            () => {
              openPost(card);
            }
          );


          card.addEventListener(
            "keypress",
            (event) => {
              if (event.key === "Enter") {
                openPost(card);
              }
            }
          );

        });


      document
        .querySelectorAll(".report-btn")
        .forEach((button) => {

          button.addEventListener(
            "click",
            (event) => {
              event.stopPropagation();

              const post = postsById.get(
                Number(button.dataset.id)
              );

              notifyAuthorOfReport(post);
            }
          );

        });


      document
        .querySelectorAll(".action-btn")
        .forEach((button) => {

          button.addEventListener(
            "click",
            (event) => {
              event.stopPropagation();
            }
          );

        });
    }


    function renderBanners(posts) {
      const dismissed = getDismissed();

      const importantPosts = posts.filter((post) => {
        return (
          post.important &&
          !dismissed.includes(post.id)
        );
      });


      bannerContainer.innerHTML =
        importantPosts.map((post) => {

          return `
            <div class="banner"
                 data-id="${post.id}">

              <div class="banner-text">

                <strong>
                  ${escapeHtml(post.title)}
                </strong>

                <span>
                  ${escapeHtml(post.summary || "")}
                </span>

              </div>


              <button class="banner-close"
                      aria-label="Dismiss">
                &times;
              </button>

            </div>
          `;

        }).join("");


      bannerContainer
        .querySelectorAll(".banner")
        .forEach((banner) => {

          banner.addEventListener(
            "click",
            () => {

              const card =
                document.querySelector(
                  `.post-card[data-id="${banner.dataset.id}"]`
                );


              if (!card) {
                return;
              }


              card.scrollIntoView({
                behavior: "smooth",
                block: "center"
              });


              if (!card.classList.contains("open")) {
                openPost(card);
              }

            }
          );


          banner
            .querySelector(".banner-close")
            .addEventListener(
              "click",
              (event) => {

                event.stopPropagation();

                dismissBanner(
                  Number(banner.dataset.id)
                );

                banner.remove();

              }
            );

        });
    }


    async function init() {
      try {
        const posts = await loadPosts();


        if (posts.length === 0) {
          postList.innerHTML =
            "<p>No news posts are available.</p>";

          return;
        }


        renderBanners(posts);
        renderPosts(posts);

      } catch (err) {
        console.error(
          "News loading failed:",
          err
        );

        postList.innerHTML = `
          <p>
            Unable to load the news feed.
            Please try again later.
          </p>
        `;
      }
    }


    init();

  })();
</script>
</body>
</html>
