<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Latest news and announcements from Websites - Hosting and Maintaining.">
  <title>Latest News - Websites</title>
  <link rel="icon" type="image/x-icon" href="../../favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
      color: #222;
    }

    a {
      color: #0c447c;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      font-size: 14px;
    }

    #banners {
      margin-bottom: 1.25rem;
    }

    .banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fef0e6;
      border: 1px solid #f3d9c0;
      color: #7a3510;
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .banner-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .banner-text strong {
      font-size: 14px;
    }

    .banner-text span {
      font-size: 13px;
      opacity: 0.85;
    }

    .banner-close {
      flex-shrink: 0;
      background: none;
      border: none;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      color: inherit;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .banner-close:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .post-list {
      display: grid;
      gap: 0.75rem;
    }

    .post-card {
      position: relative;
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      cursor: pointer;
    }

    .post-card:hover {
      border-color: rgba(0, 0, 0, 0.2);
    }

    .post-title {
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 4px;
    }

    .post-meta {
      font-size: 13px;
      color: #888;
      margin: 0 0 6px;
    }

    .post-summary,
    .post-content {
      font-size: 14px;
      color: #666;
      margin: 0;
      line-height: 1.6;
    }

    .post-content {
      display: none;
      margin-top: 8px;
    }

    .post-card.open .post-content {
      display: block;
    }

    .post-actions {
      display: flex;
      gap: 6px;
      position: absolute;
      top: 10px;
      right: 10px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
    }

    .post-card:hover .post-actions,
    .post-card:focus-within .post-actions {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .post-card.open .post-actions {
      position: static;
      opacity: 1;
      transform: none;
      pointer-events: auto;
      justify-content: flex-start;
      margin-bottom: 10px;
    }

    .action-btn {
      font-size: 12px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #f1f0e8;
      color: #444441;
      text-decoration: none;
      white-space: nowrap;
    }

    .action-btn:hover {
      background: #e2e0d0;
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      vertical-align: middle;
    }

    .badge-red {
      background: #fcebeb;
      color: #791f1f;
    }
  </style>
</head>
<body>
  <a class="back-link" href="../../index.html">&larr; Back to Websites</a>
  <h1>Latest News</h1>
  <hr>
  <div id="banners"></div>
  <div class="post-list" id="post-list">
    <p>Loading news&hellip;</p>
  </div>

  <script>
    (function () {
      const DATA_DIR = 'assets/data/';
      const DISMISSED_KEY = 'latestNewsDismissedBanners';
      const REPORT_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSd6UTp346XZBlIvx9nAIziC-OitpheKhtS5zcSr74SYxmEC4g/viewform?usp=publish-editor';
      const ADD_POST_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfDtFivE7wSPK8FkISpylP81XrhLT_94LX0UBf0psgjogZ5Bg/viewform?usp=publish-editor';
      // Comment goes to this contact for now. It's meant to move to
      // Web3Forms later once its access key is provided.
      const CONTACT_EMAIL = 'yucheng.lee29@gmail.com';
      // TODO: paste Web3Forms access key here once available, and enable
      // an autoresponder on the "email" field in the Web3Forms dashboard
      // so reported posts' authors get notified automatically.
      const WEB3FORMS_ACCESS_KEY = '';

      function getDismissed() {
        try {
          return JSON.parse(localStorage.getItem(DISMISSED_KEY) || '[]');
        } catch (err) {
          return [];
        }
      }

      function dismissBanner(id) {
        const dismissed = getDismissed();
        if (!dismissed.includes(id)) {
          dismissed.push(id);
          localStorage.setItem(DISMISSED_KEY, JSON.stringify(dismissed));
        }
      }

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str == null ? '' : String(str);
        return div.innerHTML;
      }

      async function loadPosts() {
        const mainRes = await fetch(DATA_DIR + 'main.json');
        const main = await mainRes.json();
        const files = main.posts || [];
        const posts = await Promise.all(files.map(async (file) => {
          const res = await fetch(DATA_DIR + file);
          return res.json();
        }));
        return posts.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      async function notifyAuthorOfReport(post) {
        if (!WEB3FORMS_ACCESS_KEY || !post.authorEmail) return;
        try {
          await fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({
              access_key: WEB3FORMS_ACCESS_KEY,
              subject: 'Your post was flagged: ' + post.title,
              email: post.authorEmail,
              message: 'Your post "' + post.title + '" was just reported by a reader on Latest News.'
            })
          });
        } catch (err) {
          console.error('Web3Forms notify failed', err);
        }
      }

      function commentMailto(post) {
        const subject = encodeURIComponent('Comment on: ' + post.title);
        const body = encodeURIComponent('Regarding ' + post.author + '\'s post "' + post.title + '":\n\n');
        return 'mailto:' + CONTACT_EMAIL + '?subject=' + subject + '&body=' + body;
      }

      function actionBarHtml(post) {
        return '' +
          '<div class="post-actions" role="group" aria-label="Post actions">' +
            '<a class="action-btn report-btn" data-id="' + post.id + '" href="' + REPORT_FORM_URL + '" target="_blank" rel="noopener" title="Report this post">Report</a>' +
            '<a class="action-btn" href="' + commentMailto(post) + '" title="Email the author">Comment</a>' +
            '<a class="action-btn" href="' + ADD_POST_FORM_URL + '" target="_blank" rel="noopener" title="Suggest a new post">Add post</a>' +
          '</div>';
      }

      function openPost(card) {
        document.querySelectorAll('.post-card.open').forEach(function (c) {
          if (c !== card) c.classList.remove('open');
        });
        card.classList.toggle('open');
      }

      function renderBanners(posts) {
        const dismissed = getDismissed();
        const container = document.getElementById('banners');
        const important = posts.filter(function (p) {
          return p.important && !dismissed.includes(p.id);
        });

        container.innerHTML = important.map(function (p) {
          return '' +
            '<div class="banner" data-id="' + p.id + '">' +
              '<div class="banner-text">' +
                '<strong>' + escapeHtml(p.title) + '</strong>' +
                '<span>' + escapeHtml(p.summary || '') + '</span>' +
              '</div>' +
              '<button class="banner-close" aria-label="Dismiss">&times;</button>' +
            '</div>';
        }).join('');

        container.querySelectorAll('.banner-close').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const banner = e.target.closest('.banner');
            dismissBanner(Number(banner.dataset.id));
            banner.remove();
          });
        });

        container.querySelectorAll('.banner').forEach(function (banner) {
          banner.addEventListener('click', function () {
            const id = Number(banner.dataset.id);
            const card = document.querySelector('.post-card[data-id="' + id + '"]');
            if (card) {
              card.scrollIntoView({ behavior: 'smooth', block: 'center' });
              if (!card.classList.contains('open')) openPost(card);
            }
          });
        });
      }

      function renderPosts(posts) {
        const postsById = new Map(posts.map(function (p) { return [p.id, p]; }));
        const list = document.getElementById('post-list');

        list.innerHTML = posts.map(function (p) {
          return '' +
            '<article class="post-card" data-id="' + p.id + '" tabindex="0">' +
              actionBarHtml(p) +
              '<h3 class="post-title">' + escapeHtml(p.title) + (p.important ? ' <span class="badge badge-red">Important</span>' : '') + '</h3>' +
              '<p class="post-meta">' + escapeHtml(p.date) + ' &middot; ' + escapeHtml(p.author) + '</p>' +
              '<p class="post-summary">' + escapeHtml(p.summary || '') + '</p>' +
              '<p class="post-content">' + (p.content || '') + '</p>' +
            '</article>';
        }).join('');

        list.querySelectorAll('.post-card').forEach(function (card) {
          card.addEventListener('click', function () {
            openPost(card);
          });
          card.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') openPost(card);
          });
        });

        list.querySelectorAll('.report-btn').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
            const post = postsById.get(Number(btn.dataset.id));
            if (post) notifyAuthorOfReport(post);
          });
        });

        list.querySelectorAll('.action-btn:not(.report-btn)').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.stopPropagation();
          });
        });
      }

      loadPosts().then(function (posts) {
        renderBanners(posts);
        renderPosts(posts);
      }).catch(function (err) {
        document.getElementById('post-list').innerHTML = '<p>Unable to load news right now.</p>';
        console.error(err);
      });
    })();
  </script>
</body>
</html>
